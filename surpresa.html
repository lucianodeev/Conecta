<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>CONECTA — Surpresa privada</title><style>body{margin:0;background:#170d25;color:#fff;font:18px system-ui}main{max-width:650px;margin:10vh auto;padding:30px;text-align:center;background:#291a38;border-radius:24px}h1{color:#ffb5e4}button{border:0;background:#ffb5e4;padding:15px;border-radius:12px;font:inherit;cursor:pointer}p{line-height:1.6}</style></head><body><main><h1 id="title">💌 Uma surpresa para ti</h1><p id="text">A preparar a surpresa…</p><div id="buttons"></div><p id="step"></p></main><script>(()=>{const $=id=>document.getElementById(id);const token=new URLSearchParams(location.search).get('share');if(token)history.replaceState(null,'',location.pathname);if(!token||!/^[a-f0-9]{64}$/.test(token)){$('text').textContent='Link inválido.';return}fetch('https://conecta-surpresa-api.onrender.com/api/share/'+token,{referrerPolicy:'no-referrer'}).then(async r=>{if(!r.ok)throw Error('unavailable');return r.json()}).then(d=>{let i=0;const steps=d.t==='mini'?[['Uma mensagem especial','Alguém preparou uma surpresa.'],['A revelação',d.m]]:d.t==='magic'?[['Uma pergunta',d.q],['A revelação',d.m]]:[['Uma surpresa especial','Há momentos que ficam para sempre.'],['Uma lembrança',d.memory||'Uma memória especial.'],['Uma pergunta',d.q],['A revelação',d.m]];function render(){$('title').textContent=steps[i][0];$('text').textContent=steps[i][1];$('step').textContent='Etapa '+(i+1)+' de '+steps.length;$('buttons').replaceChildren();if(i===steps.length-1)return;const question=(d.t==='magic'&&i===0)||(d.t==='premium'&&i===2);for(const label of(question?[d.a||'Sim!',d.b||'Claro!']:['Continuar ✨'])){const b=document.createElement('button');b.textContent=label;b.addEventListener('click',()=>{i++;render()});$('buttons').append(b)}}render()}).catch(()=>{$('text').textContent='Esta surpresa não está disponível, expirou ou foi revogada.'})})()</script></body></html>
