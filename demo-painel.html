<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CONECTA — Painel de demonstração</title><style>body{font:16px system-ui;background:#140d20;color:white;max-width:900px;margin:30px auto;padding:18px}h1{color:#f5a7d7}section{background:#281b35;padding:20px;border-radius:16px;margin:18px 0}button,input,select{font:inherit;padding:10px;margin:6px 0;border-radius:8px}button{cursor:pointer;background:#f5a7d7;border:0}input,select{background:#1a1025;color:white;border:1px solid #9a78a8}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #614b6d}a{color:#ffc4eb}.muted{color:#c5b3d1}#rows{overflow-x:auto}</style></head><body><h1>✦ CONECTA — Painel de demonstração</h1><p class="muted">Este painel é apenas um protótipo local. Não possui autenticação, não recebe encomendas e não guarda dados num servidor. Não utilize dados pessoais reais.</p><section><h2>Simular pedido</h2><label>Plano <select id="tier"><option>Mini</option><option>Magic</option><option>Premium</option></select></label> <label>Referência fictícia <input id="ref" maxlength="50" placeholder="Ex.: DEMO-001"></label> <button id="add">Adicionar demonstração</button></section><section><h2>Pedidos de teste</h2><div id="rows"></div><button id="clear">Limpar dados locais</button></section><p><a href="./">Voltar ao CONECTA</a></p><script>(()=>{const key='conecta_demo_orders_v1';let orders=[];try{orders=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(orders))orders=[]}catch(e){orders=[]}function save(){localStorage.setItem(key,JSON.stringify(orders))}function render(){const target=document.getElementById('rows');target.replaceChildren();if(!orders.length){target.textContent='Nenhum pedido de demonstração.';return}const table=document.createElement('table'),head=document.createElement('tr');for(const t of ['Referência','Plano','Estado','Ação']){const th=document.createElement('th');th.textContent=t;head.append(th)}table.append(head);orders.forEach((o,i)=>{const tr=document.createElement('tr');for(const val of [o.ref,o.tier,o.status]){const td=document.createElement('td');td.textContent=val;tr.append(td)}const td=document.createElement('td'),btn=document.createElement('button');btn.textContent='Avançar estado';btn.addEventListener('click',()=>{o.status=o.status==='Rascunho'?'Preparado':o.status==='Preparado'?'Entregue':'Rascunho';save();render()});td.append(btn);tr.append(td);table.append(tr)});target.append(table)}document.getElementById('add').addEventListener('click',()=>{const ref=document.getElementById('ref').value.trim();if(!ref){alert('Indique uma referência fictícia.');return}orders.push({ref,tier:document.getElementById('tier').value,status:'Rascunho'});save();render();document.getElementById('ref').value=''});document.getElementById('clear').addEventListener('click',()=>{if(confirm('Apagar todas as demonstrações deste navegador?')){orders=[];save();render()}});render()})()</script></body></html>
