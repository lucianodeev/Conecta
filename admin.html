<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>CONECTA — Administração</title><style>body{background:#150e21;color:white;font:16px system-ui;max-width:750px;margin:35px auto;padding:18px}section{background:#2a1b38;border-radius:16px;padding:20px;margin:20px 0}input,textarea,select{display:block;width:100%;box-sizing:border-box;background:#1b1227;border:1px solid #8b659a;border-radius:8px;padding:12px;color:white;font:inherit;margin:8px 0 15px}button{background:#f5a5d7;border:0;border-radius:10px;padding:12px;font:inherit;cursor:pointer;margin:5px}a{color:#ffd0f0}p{overflow-wrap:anywhere}</style></head><body><h1>✦ CONECTA — Administração</h1><p>Acesso técnico reservado. Não partilhe o token. Não é um sistema de login com contas individuais ou MFA.</p><section><label>Token administrativo <input id="token" type="password" autocomplete="off" placeholder="Introduza o token configurado no Render"></label><button id="list">Consultar pedidos</button><p id="orders"></p></section><section><h2>Criar surpresa protegida</h2><label>Plano<select id="tier"><option value="mini">Mini</option><option value="magic">Magic</option><option value="premium">Premium</option></select></label><label>Ocasião<input id="occasion" value="Amor"></label><label>Destinatário<input id="recipient"></label><label>Remetente<input id="sender"></label><label>Mensagem<textarea id="message"></textarea></label><label>Pergunta<input id="question" value="Preparado(a) para descobrir?"></label><label>Escolha A<input id="a" value="Sim!"></label><label>Escolha B<input id="b" value="Claro!"></label><label>Lembrança<textarea id="memory"></textarea></label><button id="create">Criar e gerar link</button><p id="result" role="status"></p></section><section><h2>Revogar link</h2><label>ID do link<input id="linkid" placeholder="UUID devolvido ao criar"></label><button id="revoke">Revogar</button><p id="revokeresult" role="status"></p></section><script>(()=>{const $=id=>document.getElementById(id),api='https://conecta-surpresa-api.onrender.com';async function request(path,method='GET',body){const r=await fetch(api+path,{method,headers:{'Authorization':'Bearer '+$('token').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,referrerPolicy:'no-referrer'});const j=await r.json();if(!r.ok)throw Error(j.error||'Falha');return j}const msg=(id,txt)=>$(id).textContent=txt;$('list').onclick=async()=>{try{const r=await request('/api/admin/orders');msg('orders',r.orders.map(o=>o.id+' · '+o.tier+' · '+o.status).join('\n')||'Sem pedidos')}catch(e){msg('orders',e.message)}};$('create').onclick=async()=>{try{const d={t:$('tier').value,o:$('occasion').value,r:$('recipient').value,s:$('sender').value,m:$('message').value,q:$('question').value,a:$('a').value,b:$('b').value,memory:$('memory').value};const r=await request('/api/admin/orders','POST',d);$('result').replaceChildren();const a=document.createElement('a');a.href=r.url;a.textContent=r.url;a.rel='noopener noreferrer';a.target='_blank';$('result').append('Link (copie agora): ',a,' · ID para revogação: '+r.link_id)}catch(e){msg('result',e.message)}};$('revoke').onclick=async()=>{try{const r=await request('/api/admin/revoke','POST',{link_id:$('linkid').value});msg('revokeresult',r.revoked?'Link revogado':'Não encontrado')}catch(e){msg('revokeresult',e.message)}}})()</script></body></html>
